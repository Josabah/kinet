<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kinet OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: rgb(253, 252, 249);
    }
    .og {
      width: 1200px;
      height: 630px;
      padding: 72px 88px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: "Plus Jakarta Sans", sans-serif;
    }
    .logo {
      width: 248px;
      height: auto;
      display: block;
    }
    h1 {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.05;
      color: #101828;
      max-width: 14ch;
    }
    .foot {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
    }
    .sub {
      font-size: 22px;
      font-weight: 500;
      color: #475467;
      letter-spacing: -0.02em;
    }
    .url {
      font-size: 18px;
      font-weight: 500;
      color: #2f39ba;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="og">
    <img class="logo" src="/public/kinet-logo-lockup.svg" alt="Kinet Solutions" />
    <h1>Products Founders Rely On</h1>
    <div class="foot">
      <p class="sub">Design and engineering for founders.</p>
      <p class="url">kinetsolutions.dev</p>
    </div>
  </div>
</body>
</html>

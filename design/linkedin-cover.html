      height: 382px;
      display: grid;

      height: 100%;

      z-index: 2;
    }
    .circle {
      position: absolute;
      width: 292px;
      height: 292px;
      border: 1.5px solid rgba(250, 250, 248, 0.16);
      border-radius: 50%;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
    }
    .logo {
      position: relative;
      z-index: 1;
      width: 300px;
      height: auto;
      display: block;
    }
    .copy {

      flex-direction: column;
      justify-content: center;
      padding: 0 112px 0 64px;
      font-family: "Plus Jakarta Sans", sans-serif;

    .cta {

      font-weight: 500;
      color: #475467;
      letter-spacing: -0.012em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2f39ba;
      color: #fafaf8;
      font-size: 16px;
      font-weight: 700;
      padding: 5px 11px 6px;
      border-radius: 4px;
      line-height: 1;

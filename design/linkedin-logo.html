<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kinet LinkedIn logo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 800px;
      height: 800px;
      overflow: hidden;
      background: #0B0B0C;
    }
  </style>
</head>
<body>
  <!--
    Square 800×800. LinkedIn crops to a circle.
    Mark is the official K path, optically centered, inset so the crop
    and LinkedIn’s inner padding do not clip it.
  -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="800" height="800" role="img" aria-label="Kinet">
    <rect width="512" height="512" fill="#0B0B0C" />
    <g fill="#FAFAF8" fill-rule="evenodd" transform="translate(52.12,51.48) scale(1.28)">
      <path d="M114 60L61 86L61 232L114 258L114 188L191 256L256 256L149 160L252 60L194 60L114 137Z" />
    </g>
  </svg>
</body>
</html>
